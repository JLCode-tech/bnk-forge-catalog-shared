# ------------------------------------------------------------------------
# aws-node-hp — VPC CNI DaemonSet scoped to high-performance nodes.
#
# Why this exists:
#   On HP nodes we need the eni-attachment-manager to own device indices
#   1 and 2 (internal + external SR-IOV ENIs). If the default cluster-wide
#   aws-node DS runs on an HP node with its stock MAX_ENI / WARM_ENI_TARGET
#   settings, it pre-attaches a secondary pod-IP ENI and consumes device
#   index 1 — stealing the slot the SR-IOV device plugin expects at
#   PCI 0000:00:06.0 (internal).
#
# Topology after this DS is applied:
#   - Default aws-node DS (kube-system/aws-node): anti-affinity excludes
#     nodes with label `node-type=high-performance`, i.e. only runs on
#     non-HP nodes. Keeps its standard env for full pod density there.
#   - This DS (aws-node-hp): runs ONLY on HP nodes with `MAX_ENI=1` and
#     `WARM_ENI_TARGET=0`, so VPC CNI uses the primary ENI only and does
#     not race the eni-attachment-manager for device indices 1/2.
#
# kubelet --max-pods on HP nodes must be set to the primary-ENI IP budget
# (typically 30 on c5n.4xlarge); see the node userdata in main.tf.
#
# Env var reference:
#   https://github.com/aws/amazon-vpc-cni-k8s/blob/master/docs/eni-and-ip-target.md
#
# NB: The image tag ${vpc_cni_image} is injected by main.tf from
# `var.vpc_cni_image` so the two DSes stay on matching VPC CNI versions.
# ------------------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aws-node-hp
  namespace: kube-system
  labels:
    k8s-app: aws-node
    f5.com/variant: high-performance
spec:
  selector:
    matchLabels:
      k8s-app: aws-node
      f5.com/variant: high-performance
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
    type: RollingUpdate
  template:
    metadata:
      labels:
        k8s-app: aws-node
        f5.com/variant: high-performance
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: ["high-performance"]
      tolerations:
      - operator: Exists
      hostNetwork: true
      priorityClassName: system-node-critical
      serviceAccountName: aws-node
      terminationGracePeriodSeconds: 10
      containers:
      - name: aws-node
        image: ${vpc_cni_image}
        imagePullPolicy: Always
        ports:
        - containerPort: 61678
          name: metrics
        livenessProbe:
          exec:
            command: ["/app/grpc-health-probe", "-addr=:50051", "-connect-timeout=5s", "-rpc-timeout=5s"]
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command: ["/app/grpc-health-probe", "-addr=:50051", "-connect-timeout=5s", "-rpc-timeout=5s"]
          initialDelaySeconds: 1
          periodSeconds: 10
          timeoutSeconds: 10
        env:
        - name: ADDITIONAL_ENI_TAGS
          value: "{}"
        - name: AWS_VPC_CNI_NODE_PORT_SUPPORT
          value: "true"
        - name: AWS_VPC_ENI_MTU
          value: "9001"
        - name: AWS_VPC_K8S_CNI_CONFIGURE_RPFILTER
          value: "false"
        - name: AWS_VPC_K8S_CNI_CUSTOM_NETWORK_CFG
          value: "false"
        - name: AWS_VPC_K8S_CNI_EXTERNALSNAT
          value: "false"
        - name: AWS_VPC_K8S_CNI_LOGLEVEL
          value: "DEBUG"
        - name: AWS_VPC_K8S_CNI_LOG_FILE
          value: "/host/var/log/aws-routed-eni/ipamd.log"
        - name: AWS_VPC_K8S_CNI_RANDOMIZESNAT
          value: "prng"
        - name: AWS_VPC_K8S_CNI_VETHPREFIX
          value: "eni"
        - name: AWS_VPC_K8S_PLUGIN_LOG_FILE
          value: "/var/log/aws-routed-eni/plugin.log"
        - name: AWS_VPC_K8S_PLUGIN_LOG_LEVEL
          value: "DEBUG"
        # ---------------------------------------------------------------
        # The constraints that matter for this DS:
        # ---------------------------------------------------------------
        - name: MAX_ENI
          value: "1"
        - name: WARM_ENI_TARGET
          value: "0"
        - name: WARM_IP_TARGET
          value: "5"
        - name: MINIMUM_IP_TARGET
          value: "5"
        # ---------------------------------------------------------------
        - name: DISABLE_METRICS
          value: "false"
        - name: DISABLE_NETWORK_RESOURCE_PROVISIONING
          value: "false"
        - name: ENABLE_IPv4
          value: "true"
        - name: ENABLE_IPv6
          value: "false"
        - name: ENABLE_POD_ENI
          value: "false"
        - name: ENABLE_PREFIX_DELEGATION
          value: "false"
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: VPC_CNI_VERSION
          value: ${vpc_cni_image_tag}
        resources:
          requests:
            cpu: 25m
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
        volumeMounts:
        - mountPath: /host/opt/cni/bin
          name: cni-bin-dir
        - mountPath: /host/etc/cni/net.d
          name: cni-net-dir
        - mountPath: /host/var/log/aws-routed-eni
          name: log-dir
        - mountPath: /var/run/aws-node
          name: run-dir
        - mountPath: /var/run/dockershim.sock
          name: dockershim
        - mountPath: /run/xtables.lock
          name: xtables-lock
      volumes:
      - name: cni-bin-dir
        hostPath:
          path: /opt/cni/bin
      - name: cni-net-dir
        hostPath:
          path: /etc/cni/net.d
      - name: dockershim
        hostPath:
          path: /var/run/dockershim.sock
      - name: log-dir
        hostPath:
          path: /var/log/aws-routed-eni
          type: DirectoryOrCreate
      - name: run-dir
        hostPath:
          path: /var/run/aws-node
          type: DirectoryOrCreate
      - name: xtables-lock
        hostPath:
          path: /run/xtables.lock
