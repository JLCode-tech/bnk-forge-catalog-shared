apiVersion: v1
kind: ConfigMap
metadata:
  name: sriovdp-config
  namespace: kube-system
data:
  config.json: |
    {
        "resourceList": [{
                "resourceName": "internal_netdevice",
                "selectors": {
                    "vendors": ["1d0f"],
                    "devices": ["ec20"],
                    "drivers": ["vfio-pci"],
                    "pciAddresses": ["0000:00:06.0"]
                }
            },
            {
                "resourceName": "external_netdevice",
                "selectors": {
                    "vendors": ["1d0f"],
                    "devices": ["ec20"],
                    "drivers": ["vfio-pci"],
                    "pciAddresses": ["0000:00:07.0"]
                }
            }
        ]
    }