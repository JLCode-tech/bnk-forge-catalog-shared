apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: eni-attachment-manager
  namespace: kube-system
  labels:
    app: eni-attachment-manager
spec:
  selector:
    matchLabels:
      app: eni-attachment-manager
  template:
    metadata:
      labels:
        app: eni-attachment-manager
    spec:
      hostNetwork: true
      nodeSelector:
        node-type: high-performance
      tolerations:
      - key: high-performance
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: dpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      serviceAccountName: eni-attachment-manager
      initContainers:
      - name: eni-setup
        image: python:3.9-alpine
        command: ["/bin/sh"]
        args:
        - -c
        - |
          apk add --no-cache curl bash aws-cli
          pip install boto3 requests
          python /eni-scripts/eni_attachment_manager.py
        env:
        - name: AWS_DEFAULT_REGION
          value: "${region}"
        - name: SECURITY_GROUP_IDS
          value: "${vpc_security_group_id},${cluster_security_group_id}"
        volumeMounts:
        - name: eni-scripts
          mountPath: /eni-scripts
        securityContext:
          privileged: true
      containers:
      - name: pause
        image: k8s.gcr.io/pause:3.7
      volumes:
      - name: eni-scripts
        configMap:
          name: eni-attachment-scripts
          defaultMode: 0o755