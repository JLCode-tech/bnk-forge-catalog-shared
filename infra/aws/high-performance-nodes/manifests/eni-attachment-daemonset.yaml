apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: eni-attachment-manager
  namespace: kube-system
  labels:
    app: eni-attachment-manager
spec:
  selector:
    matchLabels:
      app: eni-attachment-manager
  template:
    metadata:
      labels:
        app: eni-attachment-manager
    spec:
      hostNetwork: true
      hostPID: true
      nodeSelector:
        node-type: high-performance
      tolerations:
      - key: high-performance
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: dpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      serviceAccountName: eni-attachment-manager
      initContainers:
      # --------------------------------------------------------------
      # 1. Hugepages — runtime sysfs allocation (Layer 2 of the three-
      #    layer hugepages strategy documented in CHANGELOG v2.1.0).
      #    Layer 1 (GRUB drop-in) + Layer 3 (dpdk-hugepages.service
      #    systemd unit) still come from node userdata and only matter
      #    at boot; this init container ensures nr_hugepages is set to
      #    the desired value on every DS (re)start — self-healing if
      #    something on the node resets it at runtime.
      # --------------------------------------------------------------
      - name: hugepages-setup
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          SYS="/host-sys/kernel/mm/hugepages/hugepages-2048kB/nr_hugepages"
          if [ ! -f "$SYS" ]; then
            echo "WARN: $SYS not present — kernel may not support 2MB hugepages"
            exit 0
          fi
          CURRENT=$(cat "$SYS")
          echo "Current 2MB hugepages: $CURRENT, desired: ${hugepages_2mb_count}"
          if [ "$CURRENT" != "${hugepages_2mb_count}" ]; then
            echo "${hugepages_2mb_count}" > "$SYS"
            echo "Set 2MB hugepages to ${hugepages_2mb_count}"
          else
            echo "2MB hugepages already at desired value — no change"
          fi
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-sys
          mountPath: /host-sys
      # --------------------------------------------------------------
      # 2. ENI setup — creates the two F5 SR-IOV ENIs (internal at
      #    device index 1, external at device index 2). Requires the
      #    aws-node-hp DS to have already constrained VPC CNI with
      #    MAX_ENI=1 so device 1 is free for us to claim.
      # --------------------------------------------------------------
      - name: eni-setup
        image: python:3.9-alpine
        command: ["/bin/sh"]
        args:
        - -c
        - |
          apk add --no-cache curl bash aws-cli
          pip install boto3 requests
          python /eni-scripts/eni_attachment_manager.py
        env:
        - name: AWS_DEFAULT_REGION
          value: "${region}"
        - name: SECURITY_GROUP_IDS
          value: "${vpc_security_group_id},${cluster_security_group_id}"
        volumeMounts:
        - name: eni-scripts
          mountPath: /eni-scripts
        securityContext:
          privileged: true
      containers:
      - name: pause
        image: k8s.gcr.io/pause:3.7
      volumes:
      - name: eni-scripts
        configMap:
          name: eni-attachment-scripts
          defaultMode: 0o755
      - name: host-sys
        hostPath:
          path: /sys
          type: Directory