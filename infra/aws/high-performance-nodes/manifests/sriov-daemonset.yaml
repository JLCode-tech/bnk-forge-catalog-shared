apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-sriov-device-plugin-amd64
  namespace: kube-system
  labels:
    tier: node
    app: sriovdp
spec:
  selector:
    matchLabels:
      name: sriov-device-plugin
  template:
    metadata:
      labels:
        name: sriov-device-plugin
        tier: node
        app: sriovdp
    spec:
      hostNetwork: true
      nodeSelector:
        node-type: high-performance
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: dpu
        value: "true"
        operator: Equal
        effect: NoSchedule
      - key: high-performance
        value: "true"
        operator: Equal
        effect: NoSchedule
      serviceAccountName: sriov-device-plugin
      # RACE CONDITION FIX (aws-sydney-bnk-demo-cluster, 2026-02-10):
      # The SR-IOV device plugin scans for vfio-pci devices at startup.
      # If DPDK hasn't bound NICs yet, it finds 0 devices and reports 0
      # allocatable resources (intel.com/internal_netdevice: 0).
      # This init container gates startup until /dev/vfio exists on the host,
      # meaning DPDK has loaded vfio-pci and bound at least one device.
      initContainers:
      - name: wait-for-vfio
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Waiting for DPDK to bind NICs to vfio-pci..."
          TIMEOUT=300
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Check if vfio devices exist (DPDK creates /dev/vfio/noiommu-N)
            if ls /host-dev/vfio/noiommu-* >/dev/null 2>&1; then
              VFIO_COUNT=$(ls /host-dev/vfio/noiommu-* 2>/dev/null | wc -l)
              echo "Found $VFIO_COUNT vfio-pci device(s) — DPDK binding confirmed"
              exit 0
            fi
            # Fallback: check if any vfio device directory exists
            if [ -d "/host-dev/vfio" ] && [ "$(ls /host-dev/vfio/ 2>/dev/null | wc -l)" -gt "1" ]; then
              echo "Found /dev/vfio with devices — DPDK binding confirmed"
              exit 0
            fi
            echo "Waiting... ($ELAPSED/${TIMEOUT}s) — /dev/vfio not ready yet"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          echo "WARNING: Timeout waiting for vfio devices. Starting device plugin anyway."
          echo "This may result in 0 allocatable SR-IOV resources."
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-dev
          mountPath: /host-dev
      containers:
      - name: kube-sriovdp
        # Pinned version — do NOT use mutable 'latest-amd64' tag
        image: ghcr.io/k8snetworkplumbingwg/sriov-network-device-plugin:v3.7.0-amd64
        imagePullPolicy: IfNotPresent
        args:
        - --log-dir=sriovdp
        - --log-level=10
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: "250m"
            memory: "40Mi"
          limits:
            cpu: 1
            memory: "200Mi"
        volumeMounts:
        - name: devicesock
          mountPath: /var/lib/kubelet/device-plugins
        - name: plugins-registry
          mountPath: /var/lib/kubelet/plugins_registry
        - name: log
          mountPath: /var/log
        - name: config-volume
          mountPath: /etc/pcidp
        - name: device-info
          mountPath: /var/run/k8s.cni.cncf.io/devinfo/dp
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
        - name: devicesock
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
        - name: log
          hostPath:
            path: /var/log
        - name: device-info
          hostPath:
            path: /var/run/k8s.cni.cncf.io/devinfo/dp
            type: DirectoryOrCreate
        - name: config-volume
          configMap:
            name: sriovdp-config
            items:
            - key: config.json
              path: config.json