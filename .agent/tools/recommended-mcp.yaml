# Recommended MCP Servers
#
# REFERENCE ONLY — This is a curated catalog of MCP servers useful for coding agents.
# Copy relevant entries to your agent's MCP configuration:
#   - OpenCode: .opencode/opencode.json → "mcp" block
#   - Claude Code: claude mcp add <name> -- <command>
#   - Codex: .codex/mcp.json
#
# Agents: Read this file to understand what tools are available.
# Developers: Pick the servers relevant to your project and configure them.
#
# Last Updated: 2026-02-27

# ═══════════════════════════════════════════════════════════════════════════════
# P0 — Development Core (recommended for every project)
# ═══════════════════════════════════════════════════════════════════════════════

github:
  description: "PRs, issues, code review, Actions, Dependabot — the core dev workflow"
  install: "npx -y @anthropic-ai/github-mcp-server"
  env: { GITHUB_TOKEN: "${GITHUB_TOKEN}" }
  url: "https://github.com/github/github-mcp-server"
  notes: |
    Also supports remote HTTP via: https://api.githubcopilot.com/mcp/
    OpenCode config:
      "mcp": { "github": { "command": "npx", "args": ["-y", "@anthropic-ai/github-mcp-server"] } }

context7:
  description: "Up-to-date library docs — prevents API hallucination from stale training data"
  install: "npx -y @upstash/context7-mcp@latest"
  url: "https://github.com/upstash/context7"
  notes: |
    Essential for coding agents. Fetches real documentation at prompt time.
    OpenCode config:
      "mcp": { "context7": { "command": "npx", "args": ["-y", "@upstash/context7-mcp@latest"] } }

# ═══════════════════════════════════════════════════════════════════════════════
# P1 — Diagrams & Visual Output
# ═══════════════════════════════════════════════════════════════════════════════

excalidraw:
  description: "Full Excalidraw CRUD — create, edit, export diagrams via MCP"
  install: "npx -y excalidraw-mcp-server"
  url: "https://github.com/debu-sinha/excalidraw-mcp-server"
  notes: |
    16 MCP tools. SVG/PNG export. Mermaid diagram conversion. Inline rendering.
    Security features: API key auth, rate limiting, CORS.
    Zero-config: just run `npx excalidraw-mcp-server`
    OpenCode config:
      "mcp": { "excalidraw": { "command": "npx", "args": ["-y", "excalidraw-mcp-server"] } }

excalimaid:
  description: "Mermaid → Excalidraw converter — LLMs write Mermaid, this converts to Excalidraw"
  install: "npx -y excalimaid@latest mcp"
  url: "https://github.com/mklinovsky/excalimaid"
  notes: |
    Pragmatic approach: LLMs are already great at Mermaid syntax.
    Supports flowchart, sequence, and class diagrams.
    All processing local. Auto-opens in browser.
    OpenCode config:
      "mcp": { "excalimaid": { "command": "npx", "args": ["-y", "excalimaid@latest", "mcp"] } }

mermaid:
  description: "22+ diagram types, 50+ templates, SVG/PNG/PDF export"
  install: "npm install -g @narasimhaponnada/mermaid-mcp-server"
  url: "https://github.com/Narasimhaponnada/mermaid-mcp"
  notes: |
    Full Mermaid rendering via MCP. Uses Puppeteer for rendering.
    OpenCode config:
      "mcp": { "mermaid": { "command": "mermaid-mcp-server" } }

# ═══════════════════════════════════════════════════════════════════════════════
# P1 — Search & Web
# ═══════════════════════════════════════════════════════════════════════════════

brave-search:
  description: "Web and local search — no Google dependency"
  install: "npx -y @anthropic-ai/brave-search-mcp-server"
  env: { BRAVE_API_KEY: "${BRAVE_API_KEY}" }
  url: "https://github.com/brave/brave-search-mcp-server"

fetch:
  description: "General web content fetching, converts to LLM-friendly format"
  install: "npx -y @modelcontextprotocol/server-fetch"
  url: "https://github.com/modelcontextprotocol/servers/tree/main/src/fetch"
  notes: "Official MCP reference server. Good for fetching docs, APIs, etc."

# ═══════════════════════════════════════════════════════════════════════════════
# P2 — Database
# ═══════════════════════════════════════════════════════════════════════════════

dbhub:
  description: "Read-only database access with schema inspection (Postgres, MySQL, etc.)"
  install: "npx -y @bytebase/dbhub --dsn 'postgresql://...'"
  url: "https://github.com/bytebase/dbhub"

# ═══════════════════════════════════════════════════════════════════════════════
# P2 — Monitoring & Observability
# ═══════════════════════════════════════════════════════════════════════════════

sentry:
  description: "Retrieve and analyze errors, stack traces, performance data"
  transport: http
  url_endpoint: "https://mcp.sentry.dev/mcp"
  notes: |
    Official Sentry MCP. Remote HTTP — no local install needed.
    OpenCode config:
      "mcp": { "sentry": { "type": "remote", "url": "https://mcp.sentry.dev/mcp" } }

# ═══════════════════════════════════════════════════════════════════════════════
# P2 — Communication & Docs
# ═══════════════════════════════════════════════════════════════════════════════

notion:
  description: "Read/write Notion pages, databases, and blocks"
  transport: http
  url_endpoint: "https://mcp.notion.com/mcp"
  notes: "Official Notion MCP. Remote HTTP with OAuth."

slack:
  description: "Channel management, messaging, search"
  install: "npx -y @anthropic-ai/slack-mcp-server"
  env: { SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}" }

# ═══════════════════════════════════════════════════════════════════════════════
# P2 — Browser Testing
# ═══════════════════════════════════════════════════════════════════════════════

playwright:
  description: "LLM-driven web interaction — navigation, form filling, screenshots"
  install: "npx -y @anthropic-ai/playwright-mcp"
  url: "https://github.com/microsoft/playwright-mcp"
  notes: "Official Microsoft MCP server. Uses accessibility snapshots."

# ═══════════════════════════════════════════════════════════════════════════════
# P3 — Cloud & Infrastructure
# ═══════════════════════════════════════════════════════════════════════════════

aws:
  description: "S3, Lambda, CloudWatch, CDK and more"
  url: "https://github.com/awslabs/mcp"
  notes: "Official AWS MCP servers — multiple specialized servers per service."

terraform:
  description: "Infrastructure as code — plan, apply, inspect Terraform configs"
  url: "https://github.com/hashicorp/terraform-mcp-server"
  notes: "Official HashiCorp MCP server."

# ═══════════════════════════════════════════════════════════════════════════════
# P3 — Memory (advanced — beyond file-based memory)
# ═══════════════════════════════════════════════════════════════════════════════

memory:
  description: "Knowledge graph-based persistent memory across sessions"
  install: "npx -y @modelcontextprotocol/server-memory"
  url: "https://github.com/modelcontextprotocol/servers/tree/main/src/memory"
  notes: |
    Official MCP reference server. Good supplement to file-based memory.
    Stores facts as entities/relations in a knowledge graph.

