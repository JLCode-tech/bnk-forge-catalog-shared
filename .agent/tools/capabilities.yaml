# Available CLI Tools & Capabilities
#
# REFERENCE ONLY — Agents should use whatever approach fits best.
# This documents what's AVAILABLE and known to work, not what's REQUIRED.
# Agents are encouraged to be creative and choose the right tool for the job.
#
# Last Updated: 2026-02-27

# ═══════════════════════════════════════════════════════════════════════════════
# Diagrams
# Agents: Use any approach. Generate Mermaid, D2, Excalidraw, or raw SVG.
# These tools are pre-installed or easily installable.
# ═══════════════════════════════════════════════════════════════════════════════

diagrams:
  mermaid-cli:
    description: "Render Mermaid diagrams to SVG/PNG/PDF"
    install: "npm install -g @mermaid-js/mermaid-cli"
    usage: "mmdc -i input.mmd -o output.svg"
    formats: [svg, png, pdf]
    docker: "docker run --rm -v $(pwd):/data minlag/mermaid-cli -i /data/input.mmd -o /data/output.svg"
    tip: "LLMs are excellent at generating Mermaid syntax. This is usually the fastest path to a diagram."

  d2:
    description: "Modern diagram scripting language — great for architecture diagrams"
    install: "curl -fsSL https://d2lang.com/install.sh | sh"
    usage: "d2 input.d2 output.svg"
    formats: [svg, png, pdf]
    tip: "Multiple layout engines (dagre, ELK, TALA). No browser needed — pure Go binary."

  excalimaid:
    description: "Mermaid → Excalidraw converter (best of both worlds)"
    install: "npm install -g excalimaid"
    usage: "excalimaid 'graph TD\\nA-->B'"
    cli: "echo 'graph TD\\nA-->B' | excalimaid"
    tip: "Write Mermaid (which LLMs do well), auto-convert to editable Excalidraw."

  kroki:
    description: "Unified API for 20+ diagram types (Mermaid, D2, PlantUML, Excalidraw, etc.)"
    install: "docker run -p 8000:8000 yuzutech/kroki"
    usage: "POST diagram text to http://localhost:8000, get SVG back"
    tip: "One server, all diagram languages. Good for self-hosted setups."

# ═══════════════════════════════════════════════════════════════════════════════
# Presentations
# Agents: Choose the approach that fits. Markdown for speed, python-pptx for control.
# ═══════════════════════════════════════════════════════════════════════════════

presentations:
  marp-cli:
    description: "Markdown → presentation (PPTX, PDF, HTML)"
    install: "npm install -g @marp-team/marp-cli"
    usage: "marp slides.md --pptx"
    formats: [pptx, pdf, html]
    tip: "Fastest path from markdown to polished slides. Supports themes."

  python-pptx:
    description: "Full programmatic PPTX control (shapes, charts, tables, custom layouts)"
    install: "pip install python-pptx"
    usage: "python generate_slides.py"
    tip: "Maximum control. See docs/build_deck.py for a real-world example."

  slidev:
    description: "Developer-focused markdown slides with code highlighting"
    install: "npm install -g @slidev/cli"
    usage: "slidev slides.md"
    formats: [html, pdf]
    tip: "Best for code-heavy presentations. Live reload, Vue components."

# ═══════════════════════════════════════════════════════════════════════════════
# Documents (PDF, DOCX, etc.)
# ═══════════════════════════════════════════════════════════════════════════════

documents:
  pandoc:
    description: "Universal document converter — the Swiss army knife"
    install: "brew install pandoc   # or apt-get install pandoc"
    usage: "pandoc input.md -o output.pdf"
    formats: [pdf, docx, html, epub, pptx, latex, rst]
    tip: "Pandoc can also create PPTX from markdown. The --template flag supports custom layouts."

  typst:
    description: "Modern typesetting system (LaTeX alternative) — faster, better errors"
    install: "brew install typst"
    usage: "typst compile input.typ"
    formats: [pdf]
    tip: "If you need professional PDF output without LaTeX pain, use Typst."

  weasyprint:
    description: "HTML/CSS → PDF with high-quality typography"
    install: "pip install weasyprint"
    usage: "weasyprint input.html output.pdf"
    formats: [pdf]
    tip: "Design in HTML/CSS, render to PDF. Good for reports with custom styling."

# ═══════════════════════════════════════════════════════════════════════════════
# SVG & Image Generation
# ═══════════════════════════════════════════════════════════════════════════════

images:
  svgmaker-mcp:
    description: "AI-powered SVG generation and editing via MCP"
    install: "npx @genwave/svgmaker-mcp"
    note: "Requires API key from svgmaker.io"

  imagemagick:
    description: "Image manipulation — resize, convert, composite"
    install: "brew install imagemagick"
    usage: "convert input.png -resize 800x600 output.png"

# ═══════════════════════════════════════════════════════════════════════════════
# Usage Notes for Agents
# ═══════════════════════════════════════════════════════════════════════════════
#
# 1. You do NOT need to follow a specific tool. Pick whatever works best.
# 2. For diagrams, Mermaid is usually the fastest path (you're good at it).
# 3. For presentations, consider Marp if markdown is sufficient, python-pptx if not.
# 4. For PDFs, pandoc handles 90% of cases. Typst for professional typesetting.
# 5. Check if an MCP server is already configured (see recommended-mcp.yaml)
#    before falling back to CLI tools.
# 6. When generating files, save outputs to a sensible location (docs/, diagrams/, etc.)
