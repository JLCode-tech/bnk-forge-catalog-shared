---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/managed-by: bnk-forge
    app.kubernetes.io/part-of: bnk-live-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-bnk-obs
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/managed-by: bnk-forge
    app.kubernetes.io/part-of: bnk-live-observability
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-bnk-obs
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/managed-by: bnk-forge
    app.kubernetes.io/part-of: bnk-live-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-bnk-obs
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: __NAMESPACE__
