apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: ${observability_namespace}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: bnk-demo
    app.kubernetes.io/managed-by: bnk-forge
data:
  config.yaml: |
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    query_range:
      parallelise_shardable_queries: true
    table_manager:
      retention_deletes_enabled: true
      retention_period: ${loki_retention_hours}h
