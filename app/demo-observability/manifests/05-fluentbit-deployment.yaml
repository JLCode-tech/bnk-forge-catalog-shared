apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluentbit-hsl
  namespace: ${observability_namespace}
  labels:
    app.kubernetes.io/name: fluentbit-hsl
    app.kubernetes.io/part-of: bnk-demo
    app.kubernetes.io/managed-by: bnk-forge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluentbit-hsl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluentbit-hsl
        app.kubernetes.io/part-of: bnk-demo
    spec:
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.0
          ports:
            - containerPort: ${fluentbit_hsl_port}
              name: udp
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
