apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: ${app_namespace}
  labels:
    app.kubernetes.io/name: demo-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: bnk-demo
    app.kubernetes.io/managed-by: bnk-forge
spec:
  replicas: ${web_replicas}
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: bnk-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: web-content
          configMap:
            name: demo-web-content
            items:
              - key: index.html
                path: index.html
        - name: nginx-conf
          configMap:
            name: demo-web-content
            items:
              - key: nginx.conf
                path: nginx.conf
