apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backend
  namespace: ${app_namespace}
  labels:
    app.kubernetes.io/name: demo-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bnk-demo
    app.kubernetes.io/managed-by: bnk-forge
spec:
  replicas: ${backend_replicas}
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: bnk-demo
    spec:
      containers:
        - name: echo
          image: ealen/echo-server:0.9.2
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PORT
              value: "80"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
