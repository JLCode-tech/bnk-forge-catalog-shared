apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smartllm-client
  namespace: ${namespace}
  labels:
    app.kubernetes.io/name: smartllm-client
    app.kubernetes.io/part-of: bedrock-smartllm-demo
    app.kubernetes.io/managed-by: bnk-forge
    release: ${prometheus_release_label}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smartllm-client
  namespaceSelector:
    matchNames:
    - ${namespace}
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
