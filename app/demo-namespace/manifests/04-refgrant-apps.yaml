apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-apps
  namespace: ${app_namespace}
  labels:
    app.kubernetes.io/managed-by: bnk-forge
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: ${gateway_namespace}
  to:
    - group: ""
      kind: Service
