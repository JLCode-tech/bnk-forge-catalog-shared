apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-traffic-scripts
  namespace: ${app_namespace}
  labels:
    app.kubernetes.io/name: demo-traffic-scripts
    app.kubernetes.io/component: traffic-generator
    app.kubernetes.io/part-of: bnk-demo
    app.kubernetes.io/managed-by: bnk-forge
data:
  web-traffic.sh: |
    #!/bin/sh
    echo "Starting web traffic generator → http://${backend_service_name}.${app_namespace}.svc.cluster.local:${backend_service_port}/"
    end=$(($(date +%s) + 50))
    while [ $(date +%s) -lt $end ]; do
      curl -s -o /dev/null -w "Web: %%{http_code} %%{time_total}s\n" \
        -H "User-Agent: BNK-Demo-WebTraffic/1.0" \
        "http://${backend_service_name}.${app_namespace}.svc.cluster.local:${backend_service_port}/"
      sleep ${traffic_interval_seconds}
    done
    echo "Web traffic batch complete"
  api-traffic.sh: |
    #!/bin/sh
    echo "Starting API traffic generator → http://${backend_service_name}.${app_namespace}.svc.cluster.local:${backend_service_port}/api/"
    end=$(($(date +%s) + 50))
    i=0
    while [ $(date +%s) -lt $end ]; do
      i=$((i + 1))
      if [ $((i % 2)) -eq 0 ]; then
        curl -s -o /dev/null -w "API GET: %%{http_code} %%{time_total}s\n" \
          -H "User-Agent: BNK-Demo-APITraffic/1.0" \
          "http://${backend_service_name}.${app_namespace}.svc.cluster.local:${backend_service_port}/api/echo?request=$i"
      else
        curl -s -o /dev/null -w "API POST: %%{http_code} %%{time_total}s\n" \
          -X POST \
          -H "Content-Type: application/json" \
          -H "User-Agent: BNK-Demo-APITraffic/1.0" \
          -d "{\"message\":\"demo request $i\",\"timestamp\":\"$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)\"}" \
          "http://${backend_service_name}.${app_namespace}.svc.cluster.local:${backend_service_port}/api/data"
      fi
      sleep ${traffic_interval_seconds}
    done
    echo "API traffic batch complete"
  canary-traffic.sh: |
    #!/bin/sh
    echo "Starting canary traffic generator → http://${backend_service_name}.${app_namespace}.svc.cluster.local:${backend_service_port}/api/echo"
    end=$(($(date +%s) + 50))
    while [ $(date +%s) -lt $end ]; do
      curl -s -o /dev/null -w "Canary: %%{http_code} %%{time_total}s\n" \
        -H "X-Canary: true" \
        -H "User-Agent: BNK-Demo-CanaryTraffic/1.0" \
        "http://${backend_service_name}.${app_namespace}.svc.cluster.local:${backend_service_port}/api/echo?canary=true"
      sleep ${traffic_interval_seconds}
    done
    echo "Canary traffic batch complete"
  blocked-traffic.sh: |
    #!/bin/sh
    echo "Starting blocked source traffic → http://${backend_service_name}.${app_namespace}.svc.cluster.local:${backend_service_port}/"
    end=$(($(date +%s) + 50))
    while [ $(date +%s) -lt $end ]; do
      curl -s -o /dev/null -w "Blocked: %%{http_code} %%{time_total}s\n" \
        -H "X-Forwarded-For: 198.51.100.1" \
        -H "User-Agent: BNK-Demo-BlockedTraffic/1.0" \
        "http://${backend_service_name}.${app_namespace}.svc.cluster.local:${backend_service_port}/api/echo?source=blocked"
      sleep ${traffic_interval_seconds}
    done
    echo "Blocked traffic batch complete"
