apiVersion: batch/v1
kind: CronJob
metadata:
  name: traffic-api
  namespace: ${app_namespace}
  labels:
    app.kubernetes.io/name: traffic-api
    app.kubernetes.io/component: traffic-generator
    app.kubernetes.io/part-of: bnk-demo
    app.kubernetes.io/managed-by: bnk-forge
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-api
        app.kubernetes.io/component: traffic-generator
        app.kubernetes.io/part-of: bnk-demo
        app.kubernetes.io/managed-by: bnk-forge
    spec:
      activeDeadlineSeconds: 55
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: traffic-api
            app.kubernetes.io/component: traffic-generator
            app.kubernetes.io/part-of: bnk-demo
            app.kubernetes.io/managed-by: bnk-forge
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: curlimages/curl:8.5.0
              command: ["/bin/sh", "/scripts/api-traffic.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
          volumes:
            - name: scripts
              configMap:
                name: demo-traffic-scripts
                defaultMode: 493
