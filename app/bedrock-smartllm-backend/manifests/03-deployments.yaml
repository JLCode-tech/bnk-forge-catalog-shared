apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-micro
  namespace: ${namespace}
  labels:
    app.kubernetes.io/name: nova-micro
    app.kubernetes.io/component: bedrock-shim
    app.kubernetes.io/part-of: bedrock-smartllm-demo
    app.kubernetes.io/managed-by: bnk-forge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nova-micro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nova-micro
        app.kubernetes.io/component: bedrock-shim
        app.kubernetes.io/part-of: bedrock-smartllm-demo
    spec:
      serviceAccountName: bedrock-smartllm
      initContainers:
      - name: pip-install
        image: ${shim_image}
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
        - "pip install --no-cache-dir --target /packages -r /src/requirements.txt"
        volumeMounts:
        - name: shim-source
          mountPath: /src
        - name: packages
          mountPath: /packages
        resources:
          requests: { cpu: "100m", memory: "128Mi" }
          limits: { memory: "256Mi" }
      containers:
      - name: shim
        image: ${shim_image}
        imagePullPolicy: IfNotPresent
        command: ["python", "/src/app.py"]
        env:
        - name: MODEL_ID
          value: "amazon.nova-micro-v1:0"
        - name: MODEL_NAME
          value: "nova-micro"
        - name: AWS_REGION
          value: ${aws_region}
        - name: PYTHONPATH
          value: "/packages"
        - name: CHAT_PORT
          value: "8080"
        - name: METRICS_PORT
          value: "9100"
        ports:
        - name: chat
          containerPort: 8080
        - name: metrics
          containerPort: 9100
        volumeMounts:
        - name: shim-source
          mountPath: /src
        - name: packages
          mountPath: /packages
        livenessProbe:
          httpGet: { path: /health, port: chat }
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet: { path: /health, port: chat }
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests: { cpu: "100m", memory: "192Mi" }
          limits: { memory: "384Mi" }
      volumes:
      - name: shim-source
        configMap:
          name: bedrock-shim-source
      - name: packages
        emptyDir: {}
---
