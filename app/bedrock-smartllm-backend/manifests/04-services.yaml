apiVersion: v1
kind: Service
metadata:
  name: nova-micro
  namespace: ${namespace}
  labels:
    app.kubernetes.io/name: nova-micro
    app.kubernetes.io/component: bedrock-shim
    app.kubernetes.io/part-of: bedrock-smartllm-demo
    app.kubernetes.io/managed-by: bnk-forge
    release: ${prometheus_release_label}
spec:
  selector:
    app.kubernetes.io/name: nova-micro
  ports:
  - name: chat
    port: 8080
    targetPort: chat
  - name: metrics
    port: 9100
    targetPort: metrics
