apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${httproute_name}
  namespace: ${namespace}
  labels:
    app.kubernetes.io/part-of: bedrock-smartllm-demo
    app.kubernetes.io/managed-by: bnk-forge
spec:
  parentRefs:
  - name: ${gateway_name}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1
    backendRefs:
    - name: nova-micro
      port: 8080
      weight: 33
    - name: nova-lite
      port: 8080
      weight: 33
    - name: claude-3-haiku
      port: 8080
      weight: 34
