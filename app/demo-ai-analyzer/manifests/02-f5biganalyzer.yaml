apiVersion: k8s.f5net.com/v1alpha1
kind: F5BigAnalyzer
metadata:
  name: demo-bedrock-analyzer
  namespace: ${gateway_namespace}
  labels:
    app.kubernetes.io/name: demo-bedrock-analyzer
    app.kubernetes.io/component: ai-analyzer
    app.kubernetes.io/part-of: bnk-demo
    app.kubernetes.io/managed-by: bnk-forge
spec:
  name: demo-bedrock-analyzer
  applications:
    - name: ai-chat-route
      kind: HTTPRoute
      group: gateway.networking.k8s.io
      namespace: ${gateway_namespace}
  script:
    type: custom
    custom:
      configMapRef:
        name: bedrock-analyzer-scripts
        key: bedrock-analyzer.py
      parameters:
        - key: smart_model
          value: ${bedrock_smart_model_id}
        - key: fast_model
          value: ${bedrock_fast_model_id}
  dataSources:
    - name: litellm-prometheus
      endpoint: ${prometheus_endpoint}
  schedule: ${analyzer_schedule}
