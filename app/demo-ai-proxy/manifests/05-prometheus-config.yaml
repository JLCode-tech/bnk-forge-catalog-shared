apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ${app_namespace}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: bnk-demo
    app.kubernetes.io/managed-by: bnk-forge
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: litellm
        static_configs:
          - targets:
              - litellm-proxy.${app_namespace}.svc.cluster.local:4000
            labels:
              service: litellm-proxy
        metrics_path: /metrics
        scrape_interval: 10s
