{% if enable_ai_route %}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-chat-route
  namespace: ${gateway_namespace}
  labels:
    app.kubernetes.io/name: ai-chat-route
    app.kubernetes.io/component: routing
    app.kubernetes.io/part-of: bnk-demo
    app.kubernetes.io/managed-by: bnk-forge
spec:
  parentRefs:
    - name: ${gateway_name}
      sectionName: smart-http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat
      backendRefs:
        - name: litellm-proxy
          namespace: ${app_namespace}
          port: 4000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /v1/models
      backendRefs:
        - name: litellm-proxy
          namespace: ${app_namespace}
          port: 4000
          weight: 1
{% endif %}
