apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ${app_namespace}
  labels:
    app.kubernetes.io/name: litellm-config
    app.kubernetes.io/component: ai-proxy
    app.kubernetes.io/part-of: bnk-demo
    app.kubernetes.io/managed-by: bnk-forge
data:
  config.yaml: |
    model_list:
      - model_name: smart-model
        litellm_params:
          model: bedrock/${bedrock_smart_model_id}
          aws_region_name: ${aws_region}
      - model_name: fast-model
        litellm_params:
          model: bedrock/${bedrock_fast_model_id}
          aws_region_name: ${aws_region}

    litellm_settings:
      success_callback:
        - prometheus
      failure_callback:
        - prometheus
      drop_params: true
      set_verbose: false
      request_timeout: 120

    general_settings:
      master_key: sk-demo-not-secret
